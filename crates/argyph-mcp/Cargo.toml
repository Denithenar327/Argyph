[package]
name = "argyph-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
argyph-core = { path = "../argyph-core" }
argyph-graph = { path = "../argyph-graph" }
argyph-parse = { path = "../argyph-parse" }
argyph-fs = { path = "../argyph-fs" }
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
camino = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-std"] }
regex = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[lib]
name = "argyph_mcp"
path = "src/lib.rs"
