<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="340" fill="url(#bg)" rx="16"/>

  <!-- ===================== BEFORE ===================== -->
  <rect x="16" y="16" width="420" height="308" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="44" cy="42" r="5" fill="#f87171"/>
  <text x="60" y="47" fill="#f87171" font-size="14" font-weight="700" letter-spacing="1.5">BEFORE</text>
  <text x="142" y="47" fill="#64748b" font-size="12.5">six servers to wire and maintain</text>

  <!-- agent -->
  <rect x="166" y="64" width="120" height="38" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="226" y="88" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">AI agent</text>

  <!-- tangled links -->
  <g stroke="#ef4444" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.55" fill="none">
    <path d="M226 102 L96 168"/>
    <path d="M226 102 L226 168"/>
    <path d="M226 102 L356 168"/>
    <path d="M226 102 L96 244"/>
    <path d="M226 102 L226 244"/>
    <path d="M226 102 L356 244"/>
  </g>

  <!-- six server boxes -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="36"  y="168" width="120" height="42" rx="8" fill="#172033" stroke="#334155"/>
    <text x="96"  y="194" fill="#94a3b8">grep</text>
    <rect x="166" y="168" width="120" height="42" rx="8" fill="#172033" stroke="#334155"/>
    <text x="226" y="194" fill="#94a3b8">embeddings</text>
    <rect x="296" y="168" width="120" height="42" rx="8" fill="#172033" stroke="#334155"/>
    <text x="356" y="194" fill="#94a3b8">symbols</text>
    <rect x="36"  y="244" width="120" height="42" rx="8" fill="#172033" stroke="#334155"/>
    <text x="96"  y="270" fill="#94a3b8">packing</text>
    <rect x="166" y="244" width="120" height="42" rx="8" fill="#172033" stroke="#334155"/>
    <text x="226" y="270" fill="#94a3b8">watcher</text>
    <rect x="296" y="244" width="120" height="42" rx="8" fill="#172033" stroke="#334155"/>
    <text x="356" y="270" fill="#94a3b8">vector DB</text>
  </g>
  <text x="226" y="306" fill="#f87171" font-size="11.5" text-anchor="middle">6 installs · 6 processes · API keys · cloud accounts</text>

  <!-- ===================== AFTER ===================== -->
  <rect x="464" y="16" width="420" height="308" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="492" cy="42" r="5" fill="#34d399"/>
  <text x="508" y="47" fill="#34d399" font-size="14" font-weight="700" letter-spacing="1.5">AFTER</text>
  <text x="582" y="47" fill="#64748b" font-size="12.5">one local binary</text>

  <!-- agent -->
  <rect x="614" y="64" width="120" height="38" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="674" y="88" fill="#e2e8f0" font-size="13.5" font-weight="600" text-anchor="middle">AI agent</text>

  <!-- clean links -->
  <g stroke="#22d3ee" stroke-width="2.4" fill="none">
    <path d="M674 102 L674 150"/>
    <path d="M674 216 L674 250"/>
  </g>

  <!-- argyph -->
  <rect x="549" y="150" width="250" height="66" rx="12" fill="#10233a" stroke="url(#word)" stroke-width="2" filter="url(#glow)"/>
  <text x="674" y="181" fill="url(#word)" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">ARGYPH</text>
  <text x="674" y="202" fill="#94a3b8" font-size="11" text-anchor="middle">grep · symbols · semantic search · packing</text>

  <!-- codebase -->
  <rect x="599" y="250" width="150" height="42" rx="8" fill="#172033" stroke="#334155"/>
  <text x="674" y="276" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">your codebase</text>

  <text x="674" y="306" fill="#34d399" font-size="11.5" text-anchor="middle">1 install · runs local · no key · ready in &lt;1s</text>
</svg>
