<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="340" fill="url(#bg)" rx="16"/>

  <!-- ===================== BEFORE ===================== -->
  <rect x="14" y="14" width="430" height="312" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="46" fill="#f87171" font-size="15" font-weight="700" letter-spacing="1.5">BEFORE</text>
  <text x="116" y="46" fill="#64748b" font-size="14">six servers to wire, watch, and pay for</text>

  <!-- agent -->
  <rect x="170" y="62" width="118" height="40" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="229" y="87" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">AI agent</text>

  <!-- tangled links -->
  <g stroke="#ef4444" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.55" fill="none">
    <path d="M229 102 L92 168"/>
    <path d="M229 102 L224 168"/>
    <path d="M229 102 L356 168"/>
    <path d="M229 102 L92 246"/>
    <path d="M229 102 L224 246"/>
    <path d="M229 102 L356 246"/>
  </g>

  <!-- six server boxes -->
  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <rect x="34" y="168" width="116" height="44" rx="8" fill="#172033" stroke="#334155"/>
    <text x="92" y="195" fill="#94a3b8">grep MCP</text>
    <rect x="166" y="168" width="116" height="44" rx="8" fill="#172033" stroke="#334155"/>
    <text x="224" y="195" fill="#94a3b8">embeddings</text>
    <rect x="298" y="168" width="116" height="44" rx="8" fill="#172033" stroke="#334155"/>
    <text x="356" y="195" fill="#94a3b8">symbol search</text>
    <rect x="34" y="246" width="116" height="44" rx="8" fill="#172033" stroke="#334155"/>
    <text x="92" y="273" fill="#94a3b8">repo packing</text>
    <rect x="166" y="246" width="116" height="44" rx="8" fill="#172033" stroke="#334155"/>
    <text x="224" y="273" fill="#94a3b8">file watcher</text>
    <rect x="298" y="246" width="116" height="44" rx="8" fill="#172033" stroke="#334155"/>
    <text x="356" y="273" fill="#94a3b8">cloud vector DB</text>
  </g>
  <text x="229" y="312" fill="#f87171" font-size="12.5" text-anchor="middle">6 installs · 6 processes · API keys · cloud accounts</text>

  <!-- ===================== AFTER ===================== -->
  <rect x="456" y="14" width="430" height="312" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <text x="482" y="46" fill="#34d399" font-size="15" font-weight="700" letter-spacing="1.5">AFTER</text>
  <text x="552" y="46" fill="#64748b" font-size="14">one local binary</text>

  <!-- agent -->
  <rect x="612" y="62" width="118" height="40" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="671" y="87" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">AI agent</text>

  <!-- clean links -->
  <g stroke="#22d3ee" stroke-width="2.2" fill="none">
    <path d="M671 102 L671 158"/>
    <path d="M671 218 L671 256"/>
  </g>

  <!-- argyph -->
  <rect x="567" y="158" width="208" height="60" rx="11" fill="#10233a" stroke="url(#word)" stroke-width="2" filter="url(#glow)"/>
  <text x="671" y="184" fill="url(#word)" font-size="19" font-weight="800" letter-spacing="1.5" text-anchor="middle">ARGYPH</text>
  <text x="671" y="205" fill="#94a3b8" font-size="11.5" text-anchor="middle">grep · symbol graph · semantic search · packing</text>

  <!-- codebase -->
  <rect x="591" y="256" width="160" height="44" rx="8" fill="#172033" stroke="#334155"/>
  <text x="671" y="283" fill="#94a3b8" font-size="12.5" font-weight="600" text-anchor="middle">your codebase</text>

  <text x="671" y="318" fill="#34d399" font-size="12.5" text-anchor="middle">1 install · runs local · no key · ready in &lt;1s</text>
</svg>
