name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: axodotdev/cargo-dist@v0.28.0
        with:
          cmd: plan

  release:
    needs: plan
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.manifest).targets }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: axodotdev/cargo-dist@v0.28.0
        with:
          cmd: build

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: axodotdev/cargo-dist@v0.28.0
        with:
          cmd: publish

  dxt:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - name: Package DXT
        run: |
          cd dxt
          zip -r ../argyph.dxt manifest.json icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: argyph-dxt
          path: argyph.dxt