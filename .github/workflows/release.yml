name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

env:
  CARGO_DIST_VERSION: 'v0.28.0'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - id: plan
        run: |
          cargo dist plan --output-format=json > plan.json
          cat plan.json
          echo "manifest=$(jq -c . < plan.json)" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.manifest).targets }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install cargo-dist (Unix)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://github.com/axodotdev/cargo-dist/releases/download/$env:CARGO_DIST_VERSION/cargo-dist-installer.ps1" | iex
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build artifacts for ${{ matrix.target }}
        run: cargo dist build --target=${{ matrix.target }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/distrib/
          pattern: artifacts-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # Generate manifest for the assembled distribution.
          cargo dist manifest --output-format=json --no-local-paths > dist-manifest.json
          # Create the release with all artifacts attached.
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes "Argyph $REF_NAME release. See CHANGELOG.md for details." \
            --prerelease="${REF_NAME#v}" \
            target/distrib/*

  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Ezzy1630/argyph' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          set -e
          for crate in argyph-fs argyph-parse argyph-graph argyph-embed argyph-store argyph-pack argyph-memory argyph-locate argyph-core argyph-mcp argyph-cli argyph; do
            echo "==> Publishing $crate"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" || echo "    (already published or transient failure — continuing)"
            sleep 30
          done

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Ezzy1630/argyph' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
      - name: Sync version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          cd npm
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.VERSION;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
        # VERSION env from REF_NAME above; node reads it via process.env
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."
            exit 0
          fi
          cd npm
          if [[ "$REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

  dxt:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v5
      - name: Package DXT
        run: |
          cd dxt
          zip -r ../argyph.dxt manifest.json icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: argyph-dxt
          path: argyph.dxt

  homebrew:
    name: Update Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update SHAs in Formula/argyph.rb
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/update-homebrew.sh
          ./scripts/update-homebrew.sh "$REF_NAME"
      - name: Commit formula
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet Formula/argyph.rb; then
            git add Formula/argyph.rb
            git commit -m "chore(homebrew): update SHAs for ${REF_NAME}"
            git push origin HEAD:main
          fi
