name: Feature request
description: Suggest a new capability for Argyph.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Lead with the problem, not the solution. The clearer the problem, the more likely the feature is to land.
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: What are you trying to do that Argyph doesn't help with today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Argyph to do? Be specific about the user-visible behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you've thought about.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
