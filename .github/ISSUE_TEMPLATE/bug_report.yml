name: Bug report
description: Argyph misbehaves, crashes, or returns wrong results.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the form below.
        For security issues, do not file a public issue — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Argyph version
      description: Output of `argyph --version`
      placeholder: 0.x.y
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - npm / npx
        - cargo install
        - Homebrew
        - DXT (Claude Desktop)
        - Built from source
        - Other (please describe in additional context)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (arm64)
        - macOS (x86_64)
        - Linux (x86_64)
        - Linux (arm64)
        - Windows (x86_64)
        - Other
    validations:
      required: true
  - type: input
    id: repo-size
    attributes:
      label: Approximate repo size
      description: LOC and file count, ballpark
      placeholder: "~500K LOC, ~6000 files"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce.
      placeholder: |
        1. Run `argyph serve` against a fresh checkout of repo X
        2. Call `find_definition({"name": "Foo"})`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and correlation ID
      description: Run with `ARGYPH_LOG=debug` and paste the relevant slice. Include the `correlation_id` if you have one.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
