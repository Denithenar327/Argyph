[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.28.0"
ci = "github"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
dist = true
installers = ["shell", "powershell"]
# We hand-maintain .github/workflows/release.yml so we can wire up
# crates.io / npm / Homebrew publishing in the same workflow.
# Tell cargo-dist not to enforce its generated CI template.
allow-dirty = ["ci"]
