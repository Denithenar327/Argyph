[workspace]
resolver = "2"
members = [
    "crates/argyph",
    "crates/argyph-core",
    "crates/argyph-fs",
    "crates/argyph-parse",
    "crates/argyph-graph",
    "crates/argyph-embed",
    "crates/argyph-store",
    "crates/argyph-locate",
    "crates/argyph-pack",
    "crates/argyph-mcp",
    "crates/argyph-cli",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ezzy1630/argyph"
authors = ["Ezzy1630"]

[workspace.dependencies]
criterion = "0.5"
thiserror = "2"

[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
dist = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
